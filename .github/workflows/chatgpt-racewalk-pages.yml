name: Test and deploy RaceWalk Lab 3.0
on:
  push:
    branches: [chatgpt-racewalk-lab]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: racewalk-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core tests
        run: node chatgpt-v3/tests/core.test.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-v3/site/core.js && node --check chatgpt-v3/site/app.js
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chatgpt-v3/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
