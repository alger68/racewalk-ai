name: Test continuity and deploy RaceWalk Lab
on:
  push:
    branches: [main, fix/continuity-3.0.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: racewalk-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build controller and run core/continuity regressions
        run: |
          set -o pipefail
          mkdir -p test-results
          python scripts/build_controller.py
          node tests/core.test.mjs
          node tests/contact.test.mjs | tee test-results/contact.txt
          node tests/target-lock.test.mjs | tee test-results/target-lock.txt
          node tests/continuity.test.mjs | tee test-results/continuity.txt
          for file in site/*.js; do node --check "$file"; done
          python -m py_compile tests/browser_smoke.py tests/cache_smoke.py
      - name: Build pinned SDK and model
        run: |
          python scripts/build_site.py
          python -c "import json,pathlib; p=pathlib.Path('site/asset-manifest.json'); d=json.loads(p.read_text()); d['app']='3.0.5'; p.write_text(json.dumps(d,indent=2))"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Real inference and gap-preserving controller
        run: python tests/browser_smoke.py
      - name: Persistent model cache and corruption recovery
        run: python tests/cache_smoke.py
      - name: Save public-fixture test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.txt
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build test controller and install browsers
        run: |
          python scripts/build_controller.py
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify live inference and cache
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python tests/browser_smoke.py
          python tests/cache_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-evidence
          path: |
            test-results/*.json
            test-results/*.png
          retention-days: 14
