name: Test target lock and deploy RaceWalk Lab
on:
  push:
    branches: [main, fix/strict-target-3.0.4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: racewalk-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core and target-lock regression tests
        run: |
          set -o pipefail
          mkdir -p test-results
          node tests/core.test.mjs
          node tests/target-lock.test.mjs | tee test-results/target-lock.txt
          for file in site/*.js; do node --check "$file"; done
      - name: Build pinned SDK, WASM and model into site
        run: |
          python scripts/build_site.py
          python -c "import json,pathlib; p=pathlib.Path('site/asset-manifest.json'); d=json.loads(p.read_text()); d['app']='3.0.4'; p.write_text(json.dumps(d,indent=2))"
      - name: Install real-browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Confirmed non-first target, ROI, lost-track stop and recovery
        run: python tests/browser_smoke.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Package verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browsers and fixture encoder
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify confirmed target on published site
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/browser_smoke.py
      - name: Save live-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-evidence
          path: |
            test-results/*.json
            test-results/*.png
          if-no-files-found: warn
          retention-days: 14
