[project]
name = "racewalk-ai"
version = "0.1.0"
description = "競走影片 AI 步態分析：觸地/離地事件、騰空時間與膝角量測"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
pose = ["torch", "mmpose", "ultralytics", "opencv-python"]

[project.scripts]
racewalk = "racewalk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["racewalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
